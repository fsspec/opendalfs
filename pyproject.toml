[project]
name = "opendalfs"
dynamic = ["version"]
description = "A fsspec filesystem backed by Apache OpenDAL."
authors = [
    { name = "opendalfs contributors" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["filesystem", "fsspec", "opendal", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fsspec",
    "opendal>=0.47.5,<0.48",
]

[project.urls]
Homepage = "https://opendalfs.readthedocs.io/"
Documentation = "https://opendalfs.readthedocs.io/"
Repository = "https://github.com/fsspec/opendalfs"
Issues = "https://github.com/fsspec/opendalfs/issues"
Changelog = "https://github.com/fsspec/opendalfs/releases"

[project.entry-points."fsspec.specs"]
"opendal+s3" = "opendalfs.registry:OpendalS3FileSystem"
"opendal+gcs" = "opendalfs.registry:OpendalGCSFileSystem"
"opendal+azblob" = "opendalfs.registry:OpendalAzBlobFileSystem"

[dependency-groups]
bench = [
    "boto3>=1.37.3",
    "pyarrow>=22.0.0",
    "s3fs>=2025.5.1",
]
docs = [
    "myst-parser>=4.0.1",
    "numpydoc>=1.9.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]
test = [
    "boto3>=1.37.3",
    "dask[dataframe]==2026.8.0",
    "datasets==5.0.1",
    "dvc-objects==5.2.0",
    "intake==2.0.9",
    "lightning==2.6.5",
    "pandas==3.0.5",
    "pyarrow>=22.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.1",
    "s3fs>=2025.5.1",
    "universal-pathlib==0.3.10",
]
integration-kerchunk = [
    "h5netcdf>=1.6.4",
    "kerchunk[hdf]==0.2.10",
]
integration-rechunker = [
    "rechunker==0.5.4",
]
integration-zarr = [
    "zarr==3.3.0",
]
integration-xarray = [
    "xarray==2026.7.0",
    "zarr==3.3.0",
]
docs-examples = [
    { include-group = "test" },
    { include-group = "integration-xarray" },
]
integration-prefect = [
    "prefect==3.8.4; python_version < '3.15'",
]
integration-airflow = [
    "apache-airflow-task-sdk==1.3.1; python_version < '3.15'",
]
integration-torchdata = [
    "torchdata==0.9.0; python_version < '3.13'",
]
dev = [
    { include-group = "bench" },
    { include-group = "docs" },
    { include-group = "test" },
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.uv]
conflicts = [
    [
        { group = "integration-kerchunk" },
        { group = "integration-rechunker" },
    ],
    [
        { group = "integration-rechunker" },
        { group = "integration-zarr" },
    ],
    [
        { group = "integration-rechunker" },
        { group = "integration-xarray" },
    ],
    [
        { group = "integration-prefect" },
        { group = "integration-airflow" },
    ],
]

[tool.setuptools]
packages = ["opendalfs"]
package-dir = {"" = "."}

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
opendalfs = ["py.typed"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "SIM",
    "I",
    "C90",
    "E",
    "W",
    "F",
    "PGH",
    "UP",
    "RUF",
    "TRY",
]
ignore = [
    "E501",
    "E731",
    "TRY003",
    "S603",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.ruff.format]
preview = true

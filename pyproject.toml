[project]
name = "opendalfs"
dynamic = ["version"]
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fsspec",
    "opendal>=0.47.5,<0.48",
]

[project.entry-points."fsspec.specs"]
"opendal+s3" = "opendalfs.registry:OpendalS3FileSystem"
"opendal+gcs" = "opendalfs.registry:OpendalGCSFileSystem"
"opendal+azblob" = "opendalfs.registry:OpendalAzBlobFileSystem"

[project.optional-dependencies]
# Development dependencies
dev = [
    "ruff",              # Code formatting and linting
]

# Test dependencies
test = [
    "pytest",           # Test framework
    "pytest-asyncio",   # Async test support
    "pytest-cov",       # Coverage reporting
    "s3fs",             # S3 filesystem support
    "boto3",            # AWS S3 client for environment provision
]

# Benchmark dependencies
bench = [
    "pyarrow",         # Arrow filesystem benchmarks
    "s3fs",            # S3 filesystem support
    "boto3",           # AWS S3 client for MinIO provisioning
]

# All development dependencies
all = ["opendalfs[dev,test,bench]"]

[tool.setuptools]
packages = ["opendalfs"]
package-dir = {"" = "."}

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
opendalfs = ["py.typed"]
